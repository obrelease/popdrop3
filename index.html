<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222831">
<title>物理演算マッチ3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="hud">
    <div class="hud-box">
      <span class="hud-label">スコア</span>
      <span id="score">0</span>
    </div>
    <div class="hud-box">
      <span class="hud-label">次のボール</span>
      <div id="next-ball"><canvas id="next-ball-symbol"></canvas></div>
    </div>
    <div class="hud-box">
      <span class="hud-label">MISS</span>
      <span id="miss-display">0/3</span>
    </div>
  </div>

  <!-- 縦の残りスペースすべて。フィールドはこの中に収まる最大サイズで表示される -->
  <div id="field-area">
    <div id="field-wrapper">
      <canvas id="game-canvas"></canvas>
      <div id="banner"></div>
      <!-- 説明文はレイアウトの場所を取らないよう、フィールドの上に重ねて最初の1球で消す -->
      <p id="hint">タップ（クリック）した位置にボールが落ちます</p>
      <div id="game-over">
        <div class="game-over-title">GAME OVER</div>
        <div class="game-over-score">スコア <span id="final-score">0</span></div>
        <button id="retry-button" type="button">もう一度遊ぶ</button>
      </div>
    </div>
  </div>

  <!-- 将来の AdMob バナー用の枠。高さは CSS の --ad-height で確保している -->
  <div id="ad-slot" aria-hidden="true"></div>

  <script src="lib/matter.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
